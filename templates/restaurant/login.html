<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurant Login | Smart Food</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="/static/css/dashboard.css">
</head>
<body class="bg-darker text-main">

    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark glass-nav fixed-top py-3">
        <div class="container">
            <a class="navbar-brand fw-bold d-flex align-items-center" href="/">
                <img src="https://cdn-icons-png.flaticon.com/512/1046/1046857.png" alt="Logo" width="40" class="me-2">
                Smart Food
            </a>
            <div class="ms-auto">
                <a href="/ngo/login/" class="btn btn-outline-light rounded-pill btn-sm px-3">NGO Login</a>
            </div>
        </div>
    </nav>

    <div class="auth-wrapper">
        <div class="container z-1">
            <div class="row justify-content-center">
                <div class="col-md-5 animate-up delay-1">
                    <div class="glass-card p-5">
                        <div class="text-center mb-4">
                            <div class="d-inline-flex align-items-center justify-content-center rounded-circle mb-3" style="width: 60px; height: 60px; background: var(--warning-glow);">
                                <i class="fas fa-utensils fa-2x text-warning"></i>
                            </div>
                            <h3 class="fw-bold">Restaurant Login</h3>
                            <p class="text-muted">Sign in to report surplus food and track your impact.</p>
                        </div>
                        
                        {% if messages %}
                            {% for message in messages %}
                                <div class="alert alert-{{ message.tags }} bg-dark border-{{ message.tags }} text-{{ message.tags }} alert-dismissible fade show" role="alert">
                                    {{ message }}
                                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="alert" aria-label="Close"></button>
                                </div>
                            {% endfor %}
                        {% endif %}

                        <form method="post">
                            {% csrf_token %}
                            {{ form.as_p }}
                            <button type="submit" class="btn btn-warning w-100 py-3 mt-3 rounded-pill fw-bold shadow-sm">Sign In</button>
                        </form>

                        <div class="text-center mt-4 pt-3 border-top border-secondary border-opacity-25">
                            <span class="text-muted">New Restaurant?</span> <a href="{% url 'restaurant_register' %}" class="text-warning text-decoration-none fw-bold">Register here</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
