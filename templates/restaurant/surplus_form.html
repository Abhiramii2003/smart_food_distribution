<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submit Surplus Food</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="/static/css/dashboard.css">
</head>
<body>

<div class="wrapper">
    <!-- Sidebar -->
    <nav id="sidebar" class="glass-nav text-white" style="background: rgba(245, 158, 11, 0.9);">
        <div class="sidebar-header d-flex align-items-center">
            <img src="https://cdn-icons-png.flaticon.com/512/1046/1046857.png" alt="Logo" width="40" class="me-2">
            <h5 class="mb-0 fw-bold">Smart Food</h5>
        </div>
        <ul class="list-unstyled components mt-4">
            <li><a href="/restaurant/dashboard/"><i class="fas fa-home me-2"></i> Dashboard</a></li>
            <li class="active"><a href="/restaurant/surplus/"><i class="fas fa-plus-circle me-2"></i> Submit Surplus</a></li>
            <li><a href="/restaurant/logout/"><i class="fas fa-sign-out-alt me-2"></i> Logout</a></li>
        </ul>
    </nav>

    <!-- Page Content -->
    <div id="content">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="fw-bold">Submit Surplus Food</h2>
            {% if restaurant %}
            <span class="text-muted"><i class="fas fa-user-circle me-2"></i>{{ restaurant.name }}</span>
            {% endif %}
        </div>

        <div class="row justify-content-center mt-5">
            <div class="col-md-8 animate-up delay-1">
                <div class="glass-card p-5">
                    <h4 class="mb-4 fw-bold text-warning"><i class="fas fa-utensils me-2"></i>Food Details</h4>
                    <form method="post">
                        {% csrf_token %}
                        {{ form.as_p }}
                        <button type="submit" class="btn btn-warning w-100 mt-4 fw-bold py-2 rounded-pill shadow-sm">Submit Food Entry</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
